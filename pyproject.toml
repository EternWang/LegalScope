[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalscope"
version = "0.1.0"
description = "Public data utilities and offline reference comparisons for LegalScope."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1.2",
]

[project.optional-dependencies]
release = ["datasets>=3", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
